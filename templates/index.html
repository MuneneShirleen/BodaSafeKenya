<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BodaSafe Kenya</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .hero {
            background: url('https://images.unsplash.com/photo-1549921296-3cfc3f4ab6e5?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 2px 2px 4px #000;
        }
        .hero h1 {
            font-size: 3rem;
            font-weight: bold;
        }
        .btn-primary-custom {
            background-color: #007bff;
            border: none;
        }
        .btn-primary-custom:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<!-- Hero Section -->
<div class="hero">
    <div class="text-center">
        <h1>Welcome to BodaSafe Kenya</h1>
        <p>Your trusted boda rider management system</p>
        <a href="{{ url_for('login') }}" class="btn btn-primary btn-primary-custom btn-lg">Login</a>
    </div>
</div>

<!-- Optional content below hero -->
<div class="container my-5">
    <h2 class="text-center mb-4">Why Choose BodaSafe?</h2>
    <div class="row text-center">
        <div class="col-md-4">
            <h4>Reliable</h4>
            <p>Track and manage riders efficiently.</p>
        </div>
        <div class="col-md-4">
            <h4>Safe</h4>
            <p>Ensure riders follow safety protocols.</p>
        </div>
        <div class="col-md-4">
            <h4>Real-Time</h4>
            <p>Monitor riders and incidents instantly.</p>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
